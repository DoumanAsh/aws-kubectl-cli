name: Container

on:
  # Once a month
  schedule:
    - cron: '0 0 1 * *'
  push:
    paths:
      - '.github/workflows/container.yaml'
      - 'Dockerfile'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/container.yaml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  container:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        kubectl_version:
          - 1.36.6
          - 1.35.10
          - 1.34.13
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event.pull_request.draft == false }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "aws-kubectl-cli-ci"
      build_args: |
        KUBECTL_VERSION=${{ matrix.kubectl_version }}
      post_build_script: |
          VERSION=$(podman run --rm --entrypoint /usr/local/bin/kubectl ${{ github.event.repository.name }} version --client=true | head -n 1 | cut -d":" -f2 | tr -d ' ' | tr -d 'v')

          SHORT_VERSION=$(echo "$VERSION" | cut -d"." -f 1,2)
          echo "tags=$VERSION $SHORT_VERSION" >> "$GITHUB_OUTPUT"

          echo "- Kubectl version: $VERSION" >> $GITHUB_STEP_SUMMARY

          VERSION=$(podman run --rm --entrypoint /usr/bin/aws ${{ github.event.repository.name }} --version | cut -d" " -f1 | cut -d"/" -f2)
          echo "- AWS CLI version: $VERSION" >> $GITHUB_STEP_SUMMARY
          VERSION=$(podman run --rm --entrypoint cat ${{ github.event.repository.name }} /etc/os-release | grep VERSION_ID | cut -d"=" -f2 | tr -d '"' | cut -d"." -f 1,2)
          echo "- Alpine version: $VERSION" >> $GITHUB_STEP_SUMMARY
